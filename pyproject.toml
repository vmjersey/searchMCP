[project]
name = "searchMCP"
version = "0.0.3"
description = "MCP server for OpenSearch database interaction"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers",
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "opensearch-py>=2.0.0",
    "prometheus-client>=0.20.0",
]

[project.scripts]
searchMCP = "search_mcp.server:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=search_mcp --cov-report=term-missing"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["build", ".venv", "src/search_mcp.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "B", "BLE"]
